# Independent v8 refinement from the preserved v5 best checkpoint.
# Keep the v5 tokenizer, model dimensions, and official data split unchanged.
data_path: data/expanded/dataset-expand.txt
replay_data_path: data/tiny_shakespeare.txt
split_manifest_path: data/expanded/format_report.json
old_data_ratio: 0.20
reset_best_on_resume: false
train_split: 0.9
tokenizer: bpe
bpe_vocab_size: 512
bpe_min_frequency: 2

block_size: 256
n_layer: 4
n_head: 8
n_embd: 256
dropout: 0.1

# Conservative continuation after v5's best step; keep old-data replay high
# enough to reduce the old/expanded validation tradeoff seen in v7.
batch_size: 16
learning_rate: 0.000005
max_steps: 100000
eval_interval: 1000
eval_steps: 10
early_stopping_patience: 8
early_stopping_min_delta: 0.0001
grad_clip: 1.0
seed: 1337
device: auto
checkpoint_dir: checkpoints/v14_bpe_expanded_optimize_v8
