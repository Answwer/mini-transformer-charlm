# Independent v14 experiment: reuse the old 512-token BPE and resume the old
# best checkpoint. Paths are relative to the repository root.
data_path: data/expanded/dataset-expand.txt
replay_data_path: data/tiny_shakespeare.txt
split_manifest_path: data/expanded/format_report.json
old_data_ratio: 0.30
reset_best_on_resume: true
train_split: 0.9
tokenizer: bpe
bpe_vocab_size: 512
bpe_min_frequency: 2

# These values must remain identical to the parent v14 checkpoint.
block_size: 256
n_layer: 4
n_head: 8
n_embd: 256
dropout: 0.1

batch_size: 16
learning_rate: 0.0001
max_steps: 36000
eval_interval: 1000
eval_steps: 10
early_stopping_patience: 8
early_stopping_min_delta: 0.001
grad_clip: 1.0
seed: 1337
device: auto
checkpoint_dir: checkpoints/v14_bpe_expanded_continue
