# v14 BPE experiment. Paths are relative to the repository root.
data_path: data/tiny_shakespeare.txt
train_split: 0.9
tokenizer: bpe
bpe_vocab_size: 512
bpe_min_frequency: 2

block_size: 256
n_layer: 4
n_head: 8
n_embd: 256
dropout: 0.1

batch_size: 16
learning_rate: 0.0003
max_steps: 120000
eval_interval: 2000
eval_steps: 5
early_stopping_patience: 8
early_stopping_min_delta: 0.001
grad_clip: 1.0
seed: 1337
device: auto
checkpoint_dir: checkpoints/v14_bpe
